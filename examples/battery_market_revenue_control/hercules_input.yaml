# Input YAML for hercules

# Name
name: battery_market_revenue_control

###
# Describe this emulator setup
description: Battery alone

dt: 1.0
starttime_utc: "2020-04-01T00:00:00Z"
endtime_utc: "2020-04-07T23:55:00Z"
verbose: False


plant:
  interconnect_limit: 10000 # kW

battery:
  component_type: BatteryDynamic
  energy_capacity: 40000 # total capacity of the battery in kWh (10 MWh)
  power_charge_max: 10000 # charge rate in kW (10 MW)
  power_discharge_max: 10000 # discharge rate in kW (10 MW)
  SOC_max: 0.9
  SOC_min: 0.1
  allow_grid_power_consumption: True
  initial_conditions:
    SOC: 0.5
  log_channels:
    - power
    - SOC
    - power_setpoint

external_data:
  external_data_filename: lmp_data.csv
