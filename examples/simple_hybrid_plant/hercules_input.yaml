# Name
name: simple_hybrid_plant

###
# Describe this emulator setup
description: Floris, Solar PV and Battery Plant Example

dt: 0.5
starttime_utc: "2018-05-10T12:31:00.00Z"
endtime_utc: "2018-05-10T14:30:00.00Z"
verbose: False

plant:
  interconnect_limit: -1

wind_farm:
  component_type: WindFarm
  wake_method: precomputed
  floris_input_filename: ../example_inputs/floris_input_10turbine.yaml
  wind_input_filename: ../example_inputs/wind_input.csv
  turbine_filename: ../example_inputs/turbine_filter_model.yaml
  log_filename: log_wind_sim.log
  log_channels:
    - power
    - turbine_powers
  floris_update_time: 300.0 # Update wakes every 5 minutes

solar_farm:
    component_type: SolarPySAMPVWatts
    solar_input_filename: ../example_inputs/NonAnnualSimulation-sample_data-interpolated-daytime.csv
    system_info_file_name: ../example_inputs/100MW_1axis_pvsamv1.json
    lat: 39.7442
    lon: -105.1778
    elev: 1829
    system_capacity: 100000 # kW
    tilt: 0  # degrees
    losses: 0
    log_channels:
      - power
      - DNI
      - AOI

    initial_conditions:
      power: 25000 # kW
      DNI: 1000
      POA: 1000

battery:
  component_type: BatteryDynamic
  energy_capacity: 80000 # total capacity of the battery in kWh (4-hour 20 MW battery)
  power_charge_max: 20000 # charge rate of the battery in kW
  power_discharge_max: 20000 # discharge rate of the battery in kW
  SOC_max: 0.9 # upper boundary on battery SOC
  SOC_min: 0.1 # lower boundary on battery SOC
  allow_grid_power_consumption: False
  initial_conditions:
    SOC: 0.88   # initial state of charge of the battery in percentage of total size
  log_channels:
    - power
    - SOC

external_data:
  external_data_filename: plant_power_reference.csv
