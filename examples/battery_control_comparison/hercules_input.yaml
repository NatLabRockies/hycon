# Input YAML for hercules

# Name
name: battery_control_comparison

###
# Describe this emulator setup
description: Battery alone

dt: 0.5
starttime_utc: "2020-04-01T00:00:00Z"
endtime_utc: "2020-04-01T01:20:00Z"
verbose: False


plant:
  interconnect_limit: 20000 # kW

battery:
  component_type: BatteryDynamic
  energy_capacity: 80000 # total capacity of the battery in kWh
  power_charge_max: 20000 # charge rate in kW
  power_discharge_max: 20000 # discharge rate in kW
  SOC_max: 0.9
  SOC_min: 0.1
  allow_grid_power_consumption: True
  initial_conditions:
    SOC: 0.5
  log_channels:
    - power
    - SOC
    - power_setpoint

external_data:
  external_data_filename: power_reference.csv
  log_channels:
    - plant_power_reference
